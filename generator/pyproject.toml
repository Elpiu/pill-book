[project]
name = "bookpack"
version = "0.1.0"
description = "Trasforma un PDF in un book pack: card, mindmap e flashcard per capitolo."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "openai>=3.0",
    "pydantic>=2.10",
    "pymupdf>=1.26",
    "python-dotenv>=1.0",
    "pyyaml>=6.0",
    "rich>=14.0",
    "typer>=0.16",
]

[project.scripts]
bookpack = "bookpack.cli:app"

[dependency-groups]
dev = [
    "httpx2>=2.16.0",
    "pytest>=8.4",
    "ruff>=0.12",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bookpack"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
# Il formatter gestisce il codice: restano lunghe solo stringhe e regex
ignore = ["E501"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["typer.Argument", "typer.Option"]
